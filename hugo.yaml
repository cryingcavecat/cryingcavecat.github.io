# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://011.sh"
title: 011.sh
copyright: "with ❤️ from 🇿🇦"
theme: paperback

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "home"]

minify:
  disableXML: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Posts
          url: /posts/
          weight: 5
        - name: Toys
          url: /toys/
          weight: 8
        - name: Subjects
          url: /tags/
          weight: 10
        - name: About
          url: /about/
          weight: 15

params:
  env: production
  description: "A paperback series of dubious experiments by Liam Kloppers: hardware, software, plants and birds."
  author: Liam Kloppers
  tagline: A paperback series of dubious experiments
  tagline_short: Tinkerer. Prototyper. Sorcerer (hot sauce and otherwise).
  series: Dubious Experiments
  shelfSize: 9  # covers per page on the home page and lists

  socialIcons:
    - name: github
      url: "https://github.com/cryingcavecat"
    - name: linkedin
      url: "https://www.liamkloppers.com"
    - name: email
      url: "mailto:dm@011.sh"

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
