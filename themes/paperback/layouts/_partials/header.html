<header class="masthead wrap">
  <a class="logo" href="{{ "/" | relURL }}">{{ site.Title }}{{ with site.Params.tagline }}<small>{{ . }}</small>{{ end }}</a>
  <nav aria-label="Main">
    {{- $current := . }}
    {{- range site.Menus.main }}
    <a href="{{ .URL | relLangURL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (and $current.IsPage (eq (printf "/%s/" $current.Section) .URL)) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </nav>
</header>
