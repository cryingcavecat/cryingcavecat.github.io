{{- /* Image with optional caption. Same parameters the posts already use: src, alt, width, height, align, caption, title, link, class. */ -}}
{{- $src := .Get "src" -}}
{{- $align := .Get "align" | default "center" -}}
<figure class="fig align-{{ $align }}{{ with .Get "class" }} {{ . }}{{ end }}">
  {{- with .Get "link" }}<a href="{{ . }}">{{ end -}}
  <img src="{{ $src | relURL }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async"
    {{- with .Get "width" }} width="{{ . }}"{{ end }}{{ with .Get "height" }} height="{{ . }}"{{ end }}>
  {{- if .Get "link" }}</a>{{ end -}}
  {{- if or (.Get "title") (.Get "caption") }}
  <figcaption>{{ with .Get "title" }}<strong>{{ . }}</strong> {{ end }}{{ with .Get "caption" }}{{ . | markdownify }}{{ end }}</figcaption>
  {{- end }}
</figure>
