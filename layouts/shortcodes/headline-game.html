{{/* Embeds the headline game. Usage in a post: {{< headline-game >}} */}}
<div class="headline-game" style="margin:2rem 0">
  <iframe src="{{ "games/what-actually-happened/" | relURL }}"
          title="What actually happened? A headline game"
          loading="lazy" scrolling="no"
          style="display:block;width:100%;height:600px;border:0;background:transparent"></iframe>
  <p style="margin:.5rem 0 0;font-size:.85em;opacity:.7">
    <a href="{{ "games/what-actually-happened/" | relURL }}">Open the game on its own page</a>
  </p>
</div>
<script>
(function () {
  var frame = document.currentScript.previousElementSibling.querySelector('iframe');
  // The theme marks dark mode with data-theme on <html> (or follows the system setting); pass it on so the game matches.
  function isDark() {
    return window.paperbackIsDark ? window.paperbackIsDark() : document.documentElement.dataset.theme === 'dark';
  }
  function sendTheme() {
    if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'wah-theme', dark: isDark() }, '*');
  }
  document.documentElement.addEventListener('themechange', sendTheme);
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'wah-ready') sendTheme();
    if (e.data.type === 'wah-height') frame.style.height = e.data.h + 'px';
    if (e.data.type === 'wah-show') {
      var over = frame.getBoundingClientRect().top + e.data.bottom - window.innerHeight;
      if (over > 0) window.scrollBy({ top: over, behavior: 'smooth' });
    }
    if (e.data.type === 'wah-top' && frame.getBoundingClientRect().top < 0) frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
