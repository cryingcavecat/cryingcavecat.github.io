<style>
/* Layout: one narrow card column. The headline is the hero, set big; a highlighter swipe marks the real story on reveal. */
:root {
  --bg: #eef1f5;
  --card: #ffffff;
  --ink: #121419;
  --ink-2: #4b505b;
  --ink-3: #7c818c;
  --line: #dfe3ea;
  --mark: #ffd23f;
  --mark-ink: #121419;
  --right: #1d7f47;
  --right-bg: #e4f4ea;
  --wrong: #c0362c;
  --wrong-bg: #fbe8e6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --card: #191c22; --ink: #eef0f4; --ink-2: #b6bbc6; --ink-3: #868c98; --line: #2b2f38;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --card: #191c22; --ink: #eef0f4; --ink-2: #b6bbc6; --ink-3: #868c98; --line: #2b2f38;
  --mark: #e2b714; --mark-ink: #111214; --right: #5fcf8c; --right-bg: #173323; --wrong: #f08378; --wrong-bg: #3a1d1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font-body); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 18px; padding-block: 28px 64px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 28px; }
.brand { font: 800 15px/1 var(--font-display); letter-spacing: -.01em; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: clamp(18px, 4vw, 30px); }

.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; cursor: pointer; line-height: 1.4; }
.opt:hover:not(:disabled) { border-color: var(--ink-3); }

.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.hint { font-size: 13px; color: var(--ink-3); }

.sample .headline { font-size: clamp(22px, 4vw, 28px); margin: 6px 0; }
.sample .q { font: 500 13px var(--font-mono); color: var(--ink-3); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--ink-2); margin-bottom: 22px; }
.facts b { color: var(--ink); }

.end .big { display: flex; align-items: center; gap: 16px; margin: 6px 0 10px; }
.end .score { font: 800 clamp(56px, 12vw, 88px)/1 var(--font-display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.end .score small { font-size: .4em; color: var(--ink-3); }
.end h2 { font: 800 28px/1.15 var(--font-display); margin: 0 0 8px; text-wrap: balance; }
.end p { color: var(--ink-2); margin: 0 0 12px; max-width: 58ch; }
.review { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }

.review .mk { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 14px; }

.review .no .mk { background: var(--wrong-bg); color: var(--wrong); }
.review .h { font-weight: 600; }
.review .a { color: var(--ink-2); }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-3); }
.copied { font-size: 13px; color: var(--right); }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
html, body { margin: 0; }
.embedded .wrap { padding-block: 4px 8px; padding-inline: 2px; }
.embedded body { background: transparent; }
html.embedded { color-scheme: normal !important; }
</style>

ndia on instant payments", "other"]]}, {"id": "mb:669734", "site": "mb", "h": "SABC competing with supplier it owes R1.6 billion for important TV channel in South Africa", "url": "https://mybroadband.co.za/news/broadcasting/669734-sabc-competing-with-supplier-it-owes-r1-6-billion-for-important-tv-channel-in-south-africa.html", "actual": "SABC and Sentech, to whom it owes R1.6bn, are competing to win the contract to broadcast and stream Parliament TV.", "o": [["The SABC and Sentech, which it owes R1.6bn, are both bidding to broadcast Parliament TV", "right"], ["The SABC is launching a channel to compete with MultiChoice, which it owes money", "assumed"], ["The SABC is in a fight over a new sports channel with a producer it hasn't paid", "other"], ["The SABC is bidding against Netflix for a local drama it still owes money on", "other"]]}, {"id": "bt:875291", "site": "bt", "h": "Small 283-year-old town in South Africa becoming a new semigration hotspot", "url": "https://businesstech.co.za/news/property/875291/small-283-year-old-town-in-south-africa-becoming-a-new-semigration-hotspot/", "actual": "Urban buyers increasingly seek lifestyle farms within three hours of Cape Town, in areas like Swellendam, as an alternative to pricey coastal second homes.", "o": [["Swellendam, as buyers hunt for lifestyle farms near Cape Town", "right"], ["Tulbagh, as Gauteng families move to the Western Cape for schools and safety", "assumed"], ["Graaff-Reinet, as remote workers move to the Karoo for cheaper houses", "other"], ["Greyton, as retirees sell up in Johannesburg", "other"]]}, {"id": "bt:877493", "site": "bt", "h": "Banking goes digital-first", "url": "https://businesstech.co.za/news/industry-news/877493/banking-goes-digital-first/", "actual": "A Mastercard executive's opinion piece arguing Africa's digital-first economy depends on payment infrastructure and local investment, with Mastercard as the network behind it.", "o": [["It's a sponsored Mastercard opinion piece on payment infrastructure", "right"], ["SA banks report that most transactions now happen on mobile apps", "assumed"], ["FNB is closing its last cheque-processing centre as cheques disappear", "other"], ["The Reserve Bank approved its first fully digital bank licence in years", "other"]]}, {"id": "bt:877482", "site": "bt", "h": "Shapeshifters of growth", "url": "https://businesstech.co.za/news/industry-news/877482/shapeshifters-of-growth/", "actual": "A Mastercard-authored piece arguing digital payment acceptance and bundled solutions help South African SMEs formalise, access credit and grow.", "o": [["It's a Mastercard piece on digital payments helping small businesses grow", "right"], ["It's a feature on SA companies that keep reinventing their business models", "assumed"], ["It's a profile of start-ups that pivoted their businesses to survive load shedding", "other"], ["It's an analysis of which JSE-listed shares grew fastest this year", "other"]]}, {"id": "mb:670006", "site": "mb", "h": "Electricity rationing hits South Africa’s capital", "url": "https://mybroadband.co.za/news/energy/670006-electricity-rationing-hits-south-africas-capital.html", "actual": "After a substation explosion damaged Tshwane's Njala infeed station, the DA warns of lost transformer capacity and load reduction, and demands accountability.", "o": [["A substation explosion in Tshwane forced local load reduction", "right"], ["Tshwane started scheduled power cuts across Pretoria, like load shedding", "assumed"], ["Eskom returned to national load shedding, starting with Pretoria", "other"], ["Tshwane is cutting power to suburbs that owe the city money", "other"]]}, {"id": "bt:877548", "site": "bt", "h": "Three universities in South Africa ranked among the best in the world for the first time", "url": "https://businesstech.co.za/news/education/877548/three-universities-in-south-africa-ranked-among-the-best-in-the-world-for-the-first-time/", "actual": "Sixteen South African universities made the THE 2027 rankings; UCT was top at 147th, and three universities debuted on the list.", "o": [["Three SA universities debuted in the rankings, but only UCT made the top 300", "right"], ["UCT, Wits and Stellenbosch made the global top 200 for the first time", "assumed"], ["Three SA universities entered the world top 100 for engineering", "other"], ["Three SA universities were rated Africa's best for graduate employability", "other"]]}];
const ROUND = 20;
const SITE = { mb: 'MyBroadband', bt: 'BusinessTech' };
const KEYS = ['1', '2', '3', '4'];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let S = null;   // game state

function newGame() {
  const picks = shuffle(QUESTIONS).slice(0, ROUND);
  S = { qs: picks.map(q => ({ id: q.id, opts: shuffle(q.o.map((o, i) => i)) })), i: 0, picked: [], phase: 'ask' };
  render();
}
const Q = id => QUESTIONS.find(q => q.id === id);

function render() {
  const hud = document.getElementById('hud'), prog = document.getElementById('progress');
  if (!S) { hud.hidden = prog.hidden = true; return renderStart(); }
  if (S.phase === 'end') { hud.hidden = prog.hidden = true; return renderEnd(); }
  hud.hidden = prog.hidden = false;
  const right = S.picked.filter(p => p.ok).length;
  document.getElementById('qnum').textContent = `${S.i + 1} / ${ROUND}`;
  document.getElementById('pts').textContent = `${right} right`;
  document.getElementById('bar').style.width = `${(S.i + (S.phase === 'shown' ? 1 : 0)) / ROUND * 100}%`;
  renderQuestion();
}

function renderStart() {
  const best = store.get('wah-best');
  app.innerHTML = `
    <section class="card intro">
      <div class="site">A headline game</div>
      <h1>Can you tell <mark>what actually happened?</mark></h1>
      <p>You get ${ROUND} real South African tech and business headlines. Each one leaves something out. Pick the story you think is behind it.</p>
      <div class="sample">
        <div class="site">BusinessTech</div>
        <div class="headline">Over 220 businesses liquidated in South Africa</div>
        <div class="q">Up, down, or the same as last year? The headline won't say.</div>
      </div>
      <div class="facts">
        <span>One wrong answer per question is <b>what an AI reader assumed</b> from the headline alone.</span>
        ${best ? `<span>Your best: <b>${best} / ${ROUND}</b></span>` : ''}
      </div>
      <button class="btn" id="start" type="button">Start</button>
    </section>`;
  document.getElementById('start').addEventListener('click', newGame);
}

function renderQuestion() {
  const cur = S.qs[S.i], q = Q(cur.id), shown = S.phase === 'shown', pick = S.picked[S.i];
  const opts = cur.opts.map((oi, n) => {
    const [text, kind] = q.o[oi];
    let cls = 'opt', tag = '';
    if (shown) {
      if (kind === 'right') { cls += ' right'; tag = pick.oi === oi ? '✓ You got it' : '✓ The real story'; }
      else if (pick.oi === oi) { cls += ' wrong'; tag = kind === 'assumed' ? '✗ Your pick, and what the AI reader assumed too' : '✗ Your pick'; }
      else { cls += ' dim'; if (kind === 'assumed') tag = 'What the AI reader assumed'; }
      if (kind === 'assumed') cls += ' assumed';
    }
    return `<button type="button" class="${cls}" data-oi="${oi}" ${shown ? 'disabled' : ''} id="opt-${n}">
      <span class="k">${'ABCD'[n]}</span><span class="txt">${kind === 'right' && shown ? `<b>${esc(text)}</b>` : esc(text)}${tag ? `<span class="tag">${tag}</span>` : ''}</span></button>`;
  }).join('');
  app.innerHTML = `
    <section class="card">
      <div class="site">${SITE[q.site]}</div>
      <h2 class="headline">${esc(q.h)}</h2>
      <p class="ask">What does the article actually report?</p>
      <div class="opts">${opts}</div>
      ${shown ? `<div class="reveal">
        <div class="label">From the article</div>
        <p>${esc(q.actual)}</p>
        <div class="row">
          <a href="${esc(q.url)}" target="_blank" rel="noopener">Read it on ${SITE[q.site]}</a>
          <button type="button" class="btn" id="next">${S.i + 1 < ROUND ? 'Next headline' : 'See your score'}</button>
        </div>
      </div>` : `<p class="hint" style="margin:14px 0 0">Tip: press 1 to 4 to answer.</p>`}
    </section>`;
  if (!shown) app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.oi)));
  else { const n = document.getElementById('next'); n.addEventListener('click', next); n.focus({ preventScroll: true }); }
}

function answer(oi) {
  if (S.phase !== 'ask') return;
  const q = Q(S.qs[S.i].id);
  S.picked[S.i] = { oi, ok: q.o[oi][1] === 'right', assumed: q.o[oi][1] === 'assumed' };
  S.phase = 'shown';
  render();
  setTimeout(revealIntoView, 60);   // after the frame has grown to fit the answer
}
// After answering, scroll just enough to show the real story and the Next button (nothing if already visible).
// Inside the blog, the page around the game does the scrolling, so ask it to.
function revealIntoView() {
  const r = app.querySelector('.reveal');
  if (!r) return;
  if (document.documentElement.classList.contains('embedded')) parent.postMessage({ type: 'wah-show', bottom: r.getBoundingClientRect().bottom + window.scrollY + 16 }, '*');
  else r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next() {
  if (S.i + 1 >= ROUND) { S.phase = 'end'; const sc = S.picked.filter(p => p.ok).length; const best = +(store.get('wah-best') || 0); if (sc > best) store.set('wah-best', String(sc)); }
  else { S.i++; S.phase = 'ask'; }
  render(); if (EMBEDDED) parent.postMessage({ type: 'wah-top' }, '*'); else window.scrollTo({ top: 0 });
}

function face(level) {
  const mouth = { '-2': '<path d="M11 25 Q16 18 21 25 Z" fill="var(--ink)"/>', '-1': '<path d="M11 23.5 Q16 19 21 23.5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>',
    '0': '<path d="M11.5 21.5 H20.5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>', '1': '<path d="M11 19.5 Q16 24 21 19.5" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>',
    '2': '<path d="M10.5 18.5 Q16 27 21.5 18.5 Z" fill="var(--ink)"/>' }[level];
  return `<svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="var(--mark)"/><circle cx="11.5" cy="14" r="1.8" fill="var(--ink)"/><circle cx="20.5" cy="14" r="1.8" fill="var(--ink)"/>${mouth}</svg>`;
}

function renderEnd() {
  const sc = S.picked.filter(p => p.ok).length;
  const fell = S.picked.filter(p => p.assumed).length;
  const [lvl, title, line] =
    sc >= 18 ? [2, 'Headline whisperer', 'You read straight through them. The headlines barely slowed you down.'] :
    sc >= 14 ? [1, 'Hard to fool', 'You spotted most of what the headlines were hiding.'] :
    sc >= 9  ? [0, 'About what the headlines allow', 'Fair enough: most of these give away who the story is about and very little else.'] :
               [-1, 'The headlines got you', 'Not your fault. These headlines are built to be filled in by your imagination.'];
  const best = store.get('wah-best');
  app.innerHTML = `
    <section class="card end">
      <div class="site">Your result</div>
      <div class="big">${face(lvl)}<div class="score">${sc}<small> / ${ROUND}</small></div></div>
      <h2>${title}</h2>
      <p>${line}</p>
      <p>You picked what the AI reader assumed <b>${fell}</b> time${fell === 1 ? '' : 's'}. With no options to choose from, the AI reader got the full story right only about a quarter of the time.</p>
      <div class="row" style="justify-content:flex-start">
        <button type="button" class="btn" id="again">Play again</button>
        <button type="button" class="btn ghost" id="copy">Copy my score</button>
        <span class="copied" id="copied" hidden>Copied</span>
      </div>
      ${best ? `<p class="hint" style="margin-top:12px">Your best so far: ${best} / ${ROUND}</p>` : ''}
      <ul class="review">${S.qs.map((c, i) => { const q = Q(c.id), p = S.picked[i]; return `
        <li class="${p.ok ? 'ok' : 'no'}"><span class="mk" aria-label="${p.ok ? 'Right' : 'Wrong'}">${p.ok ? '✓' : '✗'}</span>
          <div><div class="h"><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.h)}</a></div><div class="a">${esc(q.o.find(o => o[1] === 'right')[0])}</div></div></li>`; }).join('')}
      </ul>
    </section>`;
  document.getElementById('again').addEventListener('click', newGame);
  document.getElementById('copy').addEventListener('click', async () => {
    const text = `I got ${sc}/${ROUND} on "What actually happened?", guessing the real story behind South African tech headlines.`;
    try { await navigator.clipboard.writeText(text); document.getElementById('copied').hidden = false; }
    catch { document.getElementById('copied').textContent = text; document.getElementById('copied').hidden = false; }
  });
}

document.addEventListener('keydown', e => {
  if (!S || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.phase === 'ask' && KEYS.includes(e.key)) { const b = document.getElementById('opt-' + KEYS.indexOf(e.key)); if (b) b.click(); }
  else if (S.phase === 'shown' && (e.key === 'Enter' || e.key === ' ') && document.activeElement?.id !== 'next') { e.preventDefault(); next(); }
});

const EMBEDDED = window.parent !== window;
if (EMBEDDED) {
  document.documentElement.classList.add('embedded');
  // body, not documentElement: the root is never shorter than the frame, so it could only ever grow.
  const post = () => parent.postMessage({ type: 'wah-height', h: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  new ResizeObserver(post).observe(document.body);
  window.addEventListener('load', post);
  // The host page says whether it is in light or dark mode, so the game matches its theme toggle.
  window.addEventListener('message', e => {
    if (e.source === parent && e.data && e.data.type === 'wah-theme') document.documentElement.dataset.theme = e.data.dark ? 'dark' : 'light';
  });
  parent.postMessage({ type: 'wah-ready' }, '*');
}
render();
</script>

</body>
